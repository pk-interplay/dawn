name: CI

# Spec §7.3: "CI runs the suite on any prompt or model change; regressions block
# merge." This is the enforcement point for that.
#
# Two jobs, split by whether they cost money:
#
#   checks  — typecheck + offline unit tests. Runs on every push and PR.
#   eval    — the labeled LLM evaluation sets. Calls the Anthropic API, so it
#             only runs when the repo has a key configured, and only when a file
#             that could change model behaviour was touched.

on:
  push:
    branches: [main, nexus]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Nexus v0.2 §5.1/claims.ts: writeClaim/writeClaims is the only path into
      # `claims` (confidence clamping and append-only both live there). A direct
      # insert anywhere else bypasses that and re-opens the exact silent-write
      # failure mode 0013 already cost this project once.
      - name: No direct writes to claims outside claims.ts
        run: |
          if grep -rn 'from("claims")' src app --include='*.ts' --include='*.tsx' | grep -v 'src/lib/claims.ts' | grep -v '\.test\.ts'; then
            echo "Direct claims table access found outside src/lib/claims.ts — route it through writeClaim/writeClaims instead." >&2
            exit 1
          fi

      # The email layer is back, and SPEC §3.2's gateway is what makes that safe: every
      # send passes suppression → consent → rate limit → idempotency → approval, and
      # delivery is behind a single fail-closed switch. That property is worth exactly
      # as much as the guarantee that there is no second path around it, so the previous
      # blanket ban on `agentmail` is replaced by four narrower checks that together are
      # STRICTER than it was — one transport, one caller, no alternatives, and a switch
      # that cannot be refactored into defaulting on.
      #
      # NOTE: none of this can cover Supabase Auth's own mailer, which sends from the
      # platform rather than from this repo. That is disabled in the project's dashboard
      # settings (custom SMTP cleared, email provider off); see RUNBOOK.
      # Matches the granted-scope URL form (`auth/gmail.send`) rather than a bare
      # `gmail.send`, so prose explaining WHY those scopes are dropped — as
      # src/lib/google-scopes.ts does — doesn't fail the build. A guard that trips on
      # its own documentation gets deleted by the next person, which is worse than
      # not having one.

      - name: One transport — only agentmail.ts may import the SDK
        run: |
          if grep -rnE 'from "agentmail"|require\("agentmail"\)' \
               src app lib components supabase --include='*.ts' --include='*.tsx' \
             | grep -v '^src/lib/agentmail.ts:'; then
            echo "The AgentMail SDK may only be imported by src/lib/agentmail.ts." >&2
            echo "Everything else goes through src/lib/send-gateway.ts." >&2
            exit 1
          fi

      # Scoped to the two functions that TRANSMIT, not to the module. agentmail.ts also
      # exports the inbox-id constant and a read-only message lister, and neither
      # creates a send path — `AGENTMAIL_INBOX_ID` is an identifier written into rows,
      # and reading an inbox has nothing to suppress, no consent to establish, and no
      # ledger row to write. The gateway governs what LEAVES; a guard that also blocked
      # reads would be lying about what it protects, and the next person would widen it
      # in a hurry rather than understand it.
      - name: One caller — only send-gateway.ts may import a send function
        run: |
          if grep -rnE '^import[^;]*\b(sendEmail|replyToMessage)\b[^;]*from "[^"]*agentmail"' \
               src app lib components supabase --include='*.ts' --include='*.tsx' \
             | grep -v '^src/lib/send-gateway.ts:'; then
            echo "sendEmail/replyToMessage are the raw transport and perform no gating." >&2
            echo "Import send() from src/lib/send-gateway.ts instead — it owns suppression," >&2
            echo "consent, rate limiting, the idempotency ledger, and the delivery switch." >&2
            exit 1
          fi

      - name: No alternative send path
        run: |
          if grep -rnE 'from "resend"|nodemailer|@sendgrid|postmark|mailgun|auth/gmail\.send|auth/gmail\.compose|messages/send' \
               src app lib components supabase --include='*.ts' --include='*.tsx'; then
            echo "An email send path was introduced that bypasses SPEC §3.2's gateway." >&2
            exit 1
          fi

      # Cheap, and it catches the one refactor that silently turns delivery on for
      # everybody. `=== "true"` means unset/empty/typo → OFF; `!== "false"` inverts that
      # so a missing variable means SEND. That exact inversion has already cost this
      # project once, in isSingleSided(), where it silently marked a real human as having
      # consented to an introduction nobody had asked them about.
      - name: Delivery switch defaults to off
        run: |
          if ! grep -q 'process.env.DAWN_DELIVERY_ENABLED === "true"' src/lib/send-gateway.ts; then
            echo "send-gateway.ts must read DAWN_DELIVERY_ENABLED with === \"true\"." >&2
            exit 1
          fi
          if grep -n 'DAWN_DELIVERY_ENABLED !== "false"' src/lib/send-gateway.ts; then
            echo "DAWN_DELIVERY_ENABLED must never be read as !== \"false\" — absence must mean off." >&2
            exit 1
          fi

  eval:
    runs-on: ubuntu-latest
    needs: checks
    # A fork PR has no access to secrets, so this would fail for reasons that
    # have nothing to do with the change. Skip rather than fail red.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed for the paths-filter diff below.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Evals are the expensive job, so only pay for them when something that
      # could actually move a score changed: a prompt, a schema, the LLM client,
      # or a fixture set.
      - name: Did anything model-facing change?
        id: filter
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"   # first push on a branch: no baseline, so run
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -qE '^src/(llm|eval)/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run evals
        if: steps.filter.outputs.run == 'true' && env.ANTHROPIC_API_KEY != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run test:eval
